# 운영 환경 오버레이.
# helm install myproject ./helm/ai-dev-framework \
#   -f helm/ai-dev-framework/values-prod.yaml \
#   --set postgresql.password=<시크릿 매니저에서 가져온 값> \
#   --set coreService.image.tag=<릴리스 태그> --set bffService.image.tag=<릴리스 태그> \
#   --set frontend.image.tag=<릴리스 태그>
#
# postgresql.password는 절대 이 파일에 커밋하지 말고 --set이나 helm secrets/sealed-secrets 같은
# 도구로 주입할 것. core-service는 SPRING_PROFILES_ACTIVE=prod로 실행해야
# DevAdminSeeder(admin/admin1234 자동 생성)가 비활성화된다 — coreService.extraEnv에 추가할 것.

postgresql:
  enabled: true # 관리형 DB(RDS/Cloud SQL/Azure Database 등)로 옮기면 false로 끄고
  # coreService.extraEnv / bffService.extraEnv로 그 DB 접속 정보를 직접 넣는다.
  persistence:
    size: 10Gi

coreService:
  image:
    tag: "REPLACE_WITH_RELEASE_TAG"
  replicaCount: 2
  extraEnv:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

bffService:
  image:
    tag: "REPLACE_WITH_RELEASE_TAG"
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  image:
    tag: "REPLACE_WITH_RELEASE_TAG"
  replicaCount: 2

ingress:
  host: "example.com" # 실제 운영 도메인으로 바꿀 것
  annotations: {}
  # TLS 붙일 때 예시 (cert-manager 설치되어 있어야 함):
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
