{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-dev-framework.fullname" . }}-postgresql
  labels:
    {{- include "ai-dev-framework.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  DB_URL: {{ printf "jdbc:postgresql://%s-postgresql:5432/%s" (include "ai-dev-framework.fullname" .) .Values.postgresql.database | quote }}
  # bff-service 전용 DB (core-service의 public 스키마와 분리 — 위 postgresql.bffDatabase 주석 참고)
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.username .Values.postgresql.password (include "ai-dev-framework.fullname" .) .Values.postgresql.bffDatabase | quote }}
{{- end }}
