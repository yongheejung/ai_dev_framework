apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-dev-framework.fullname" . }}-bff-service-migrate-{{ .Release.Revision }}
  labels:
    {{- include "ai-dev-framework.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff-service-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "ai-dev-framework.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bff-service-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        {{- include "ai-dev-framework.waitForPostgres" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.bffService.image.repository }}:{{ .Values.bffService.image.tag }}"
          imagePullPolicy: {{ .Values.bffService.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-dev-framework.fullname" . }}-postgresql
                  key: DATABASE_URL
            {{- end }}
            {{- with .Values.bffService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
