apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-dev-framework.fullname" . }}-core-service
  labels:
    {{- include "ai-dev-framework.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ai-dev-framework.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core-service
  ports:
    - port: 80
      targetPort: {{ .Values.coreService.port }}
