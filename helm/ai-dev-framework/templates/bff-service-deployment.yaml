apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-dev-framework.fullname" . }}-bff-service
  labels:
    {{- include "ai-dev-framework.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff-service
spec:
  replicas: {{ .Values.bffService.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-dev-framework.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bff-service
  template:
    metadata:
      labels:
        {{- include "ai-dev-framework.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bff-service
    spec:
      initContainers:
        {{- include "ai-dev-framework.waitForPostgres" . | nindent 8 }}
      containers:
        - name: bff-service
          image: "{{ .Values.bffService.image.repository }}:{{ .Values.bffService.image.tag }}"
          imagePullPolicy: {{ .Values.bffService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.bffService.port }}
          env:
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-dev-framework.fullname" . }}-postgresql
                  key: DATABASE_URL
            {{- end }}
            - name: CORE_SERVICE_BASE_URL
              value: "http://{{ include "ai-dev-framework.fullname" . }}-core-service"
            {{- with .Values.bffService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.bffService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.bffService.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.bffService.resources | nindent 12 }}
