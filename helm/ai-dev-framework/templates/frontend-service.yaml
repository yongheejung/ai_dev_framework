{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-dev-framework.fullname" . }}-frontend
  labels:
    {{- include "ai-dev-framework.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ai-dev-framework.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
{{- end }}
